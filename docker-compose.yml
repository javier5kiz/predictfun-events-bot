# ── Docker Compose for Predict.fun Events Contrast Bot ──────────────
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker-compose up -d        (start in background)
#   3. docker-compose logs -f       (follow logs)
#   4. docker-compose down          (stop)
#
# For dry-run mode (no real orders):
#   docker-compose run bot --dry-run

services:
  predict-bot:
    build: .
    container_name: predict-fun-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    # Override command for dry-run testing:
    # command: ["--dry-run"]
    networks:
      - predict-net

networks:
  predict-net:
    driver: bridge
